name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      liveEvals:
        description: "Run the eval suite against Azure OpenAI (costs a few cents)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Eval plumbing check (scripted model, no LLM)
        run: LLM_PROVIDER=scripted python -m evals.run_evals --repeats 1 --min-pass-rate 1.0 --out /tmp/evals.json
      - name: Docker image builds
        run: docker build -t checkoutops-agent .

  live-evals:
    # Manual only: prompts and models are tested like code before a change ships.
    if: github.event_name == 'workflow_dispatch' && inputs.liveEvals
    needs: test
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: azure
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5-mini' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m evals.run_evals --repeats 2 --min-pass-rate 0.8 --out eval-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
